name: Fortune top 10 statements snapshot

on:
  workflow_dispatch:
    inputs:
      start:
        description: Inclusive start period (YYYY-MM-DD)
        required: false
        default: ''
      end:
        description: Inclusive end period (YYYY-MM-DD)
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect statements into CSV
        run: |
          python scripts/collect_financial_frames.py \
            --tickers-csv inputs/fortune_1000_plus_tech_firms.csv \
            --limit 10 \
            --start '${{ inputs.start }}' \
            --end '${{ inputs.end }}' \
            --out-csv artifacts/fortune_top10_statements.csv

      - uses: actions/upload-artifact@v4
        with:
          name: fortune-top10-statements
          path: artifacts/fortune_top10_statements.csv
